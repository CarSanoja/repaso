name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -c requirements.lock ruff
      - run: ruff check .

  test:
    name: test
    runs-on: ubuntu-latest
    env:
      REPASO_LOCAL_MODE: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -c requirements.lock -e ".[dev]"
      - run: pytest -q
      - run: python -m build --wheel --no-isolation
      - name: Test the installed wheel outside the source checkout
        run: |
          python -m venv /tmp/repaso-wheel
          /tmp/repaso-wheel/bin/pip install -c requirements.lock dist/*.whl
          cp scripts/check_installed_package.py /tmp/check_repaso_package.py
          cd /tmp
          /tmp/repaso-wheel/bin/python check_repaso_package.py

  infra:
    name: infra
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -c requirements.lock -e ".[dev,deploy]"
      - run: pytest -q tests/infra

  hygiene:
    name: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: tracked files carry nothing a public repo must not
        run: python scripts/check_repo_hygiene.py
      - name: no forbidden path has ever been committed
        run: |
          set -euo pipefail
          found=$(git log --all --pretty=format: --name-only --diff-filter=A \
            | sort -u \
            | grep -E '^(private/|\.local_data/|\.env$|\.bedrock_agentcore\.yaml$)' || true)
          if [ -n "$found" ]; then
            echo "these paths exist somewhere in history:" >&2
            echo "$found" >&2
            exit 1
          fi
          echo "history is clean"
