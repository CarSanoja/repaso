<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
<title id="title">Repaso - School Community Memory architecture</title>
<desc id="desc">Telegram messages pass through an HTTP webhook, EventBridge, SQS and a Lambda worker into AgentCore Runtime. Four Strands graphs and conversational help use Bedrock, Textract and family-scoped DynamoDB and S3 state. A recoverable outbox sends replies. A separate read-only observer reconstructs learning episodes from DynamoDB records and correlated CloudWatch events.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9bc270"/></marker><marker id="bluearrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#7ccbd5"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#e8eee7}.label{font-size:12px;letter-spacing:2px;fill:#9cb194}.title{font-size:23px;font-weight:600}.body{font-size:16px;fill:#b9c9b6}.small{font-size:13px;fill:#9dae9b}.green{fill:#b8f37a}.blue{fill:#7ccbd5}.box{fill:#15221b;stroke:#40593a;stroke-width:1.5}.sub{fill:#1c2d20;stroke:#40543a;stroke-width:1}.flow{fill:none;stroke:#9bc270;stroke-width:2;marker-end:url(#arrow)}.read{fill:none;stroke:#7ccbd5;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#bluearrow)}</style></defs>
<rect width="1600" height="1200" fill="#0c1311"/>
<rect x="50" y="48" width="52" height="52" rx="15" fill="#b8f37a"/><text x="64" y="83" font-size="35" font-weight="700" style="fill:#152211">r.</text>
<text x="120" y="68" class="label">REPASO / SCHOOL COMMUNITY MEMORY</text><text x="120" y="106" font-size="34" font-weight="500">A conversation that leaves a usable learning record.</text>
<text x="50" y="145" class="body">Implemented application path · AgentCore v13 live exchange verified 14 September 2026 · observer runs locally</text>

<rect x="50" y="185" width="285" height="155" rx="15" class="box"/>
<text x="72" y="214" class="label blue">THE FAMILY</text><text x="72" y="250" class="title">Telegram</text><text x="72" y="280" class="body">Material · questions · answers</text><text x="72" y="307" class="body">Requests for help · adult choices</text>
<path d="M335 258H389" class="flow"/>

<rect x="395" y="185" width="805" height="155" rx="15" class="box"/>
<text x="421" y="214" class="label">ASYNC TRANSPORT / AWS</text><text x="421" y="253" class="title">HTTP webhook → EventBridge → SQS → Worker</text><text x="421" y="284" class="body">API Gateway + Lambda · queued work · dead-letter queues</text><text x="421" y="310" class="small">The worker resolves the runtime ARN through SSM and invokes AgentCore.</text>
<path d="M797 340V384" class="flow"/>

<rect x="1250" y="185" width="300" height="155" rx="15" class="box"/>
<text x="1272" y="214" class="label">SCHEDULED WORK</text><text x="1272" y="251" class="title">Family schedule</text><text x="1272" y="282" class="body">EventBridge Scheduler</text><text x="1272" y="308" class="small">Scheduler Lambda → event bus</text>
<path d="M1250 258H1205" class="flow"/>

<rect x="395" y="390" width="805" height="325" rx="17" fill="#1a2b1d" stroke="#7eaa58" stroke-width="2"/>
<text x="422" y="422" class="label green">AMAZON BEDROCK AGENTCORE RUNTIME</text><text x="422" y="458" class="title">Strands graphs + typed model calls</text>
<rect x="421" y="480" width="360" height="68" rx="9" class="sub"/><text x="439" y="507" font-size="17" class="green">Ingestion</text><text x="439" y="532" class="small">Parse → screen → map → generate → validate</text>
<rect x="799" y="480" width="374" height="68" rx="9" class="sub"/><text x="817" y="507" font-size="17" class="green">Practice</text><text x="817" y="532" class="small">Plan → compose</text>
<rect x="421" y="562" width="360" height="68" rx="9" class="sub"/><text x="439" y="589" font-size="17" class="green">Response</text><text x="439" y="614" class="small">Grade → apply → adapt → escalate</text>
<rect x="799" y="562" width="374" height="68" rx="9" class="sub"/><text x="817" y="589" font-size="17" class="green">Daily quality</text><text x="817" y="614" class="small">Verify → engagement → cohort → optimize</text>
<text x="422" y="660" class="body">Help path: interpret turn → retrieve prior approaches → explain → remember</text>
<text x="422" y="689" class="small">Deterministic controls: ownership · assessment · spacing · budgets · recovery · decisions</text>

<rect x="1250" y="425" width="300" height="235" rx="15" class="box"/>
<text x="1272" y="456" class="label">INFERENCE + DOCUMENTS</text><text x="1272" y="493" class="title">Amazon Bedrock</text><text x="1272" y="524" class="body">Role-specific model selection</text><text x="1272" y="551" class="body">Input / output guardrails</text><path d="M1272 569H1526" stroke="#354b32"/><text x="1272" y="599" class="title">Amazon Textract</text><text x="1272" y="631" class="body">Supported printed material</text>
<path d="M1200 532H1245" class="flow"/>

<rect x="50" y="500" width="285" height="165" rx="15" class="box"/>
<text x="72" y="530" class="label">RECOVERABLE DELIVERY</text><text x="72" y="567" class="title">Pending outbox</text><text x="72" y="598" class="body">Send → retain acknowledgement</text><text x="72" y="631" class="small">At least once; a retry can duplicate</text><text x="72" y="649" class="small">a message if its receipt was lost.</text>
<path d="M395 580H340" class="flow"/><path d="M192 500V346" class="flow"/>
<text x="207" y="420" class="small green">reply</text>

<rect x="395" y="770" width="435" height="140" rx="15" class="box"/>
<text x="419" y="799" class="label">FAMILY-SCOPED PERSISTENCE</text><text x="419" y="835" class="title">DynamoDB</text><text x="419" y="865" class="body">Notes · assessments · mastery · review dates</text><text x="419" y="891" class="small">Human decisions · operation records · outbox receipts</text>
<path d="M612 715V765" class="flow"/>
<rect x="860" y="770" width="340" height="140" rx="15" class="box"/>
<text x="883" y="799" class="label">MATERIAL STORAGE</text><text x="883" y="835" class="title">Amazon S3</text><text x="883" y="865" class="body">Uploaded material · curriculum</text><text x="883" y="891" class="small">Encrypted storage · scoped material access</text>
<path d="M1030 715V765" class="flow"/>
<rect x="1250" y="770" width="300" height="140" rx="15" class="box"/>
<text x="1272" y="799" class="label">INSTRUMENTED EVIDENCE</text><text x="1272" y="835" class="title">CloudWatch</text><text x="1272" y="865" class="body">Correlated application events</text><text x="1272" y="891" class="small">Model calls · retrieval · delivery</text>
<path d="M1173 715V740H1400V765" class="flow"/>

<rect x="50" y="790" width="285" height="120" rx="12" fill="#142021" stroke="#355359"/>
<text x="72" y="822" class="label blue">HUMAN IN CONTROL</text><text x="72" y="855" class="body">Review uncertain answers.</text><text x="72" y="881" class="body">Choose the next intervention.</text>

<rect x="395" y="990" width="1155" height="150" rx="17" fill="#142326" stroke="#629ca3" stroke-width="1.8"/>
<text x="423" y="1022" class="label blue">SEPARATE READ-ONLY OBSERVER / LOCAL FASTAPI + BROWSER</text><text x="423" y="1058" class="title">School Community Memory</text><text x="423" y="1088" class="body">Family dashboard → learner / topic / day → retained conversation + agent memory + learning evidence</text><text x="423" y="1116" class="small">Explicit family allowlist · verified record/event links · Live / Replay · gaps and current totals labeled</text>
<path d="M612 910V984" class="read"/><path d="M1400 910V984" class="read"/>
<text x="628" y="953" class="small blue">read stored state</text><text x="1220" y="953" class="small blue">read correlated events</text>
<text x="50" y="1176" class="small">Application learning memory is stored in DynamoDB. The separate AgentCore Memory service is not provisioned. A stored review date is not a delivery receipt.</text>
</svg>
