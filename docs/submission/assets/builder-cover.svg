<text x="55" y="164" class="white" font-size="53" font-weight="600" letter-spacing="-2">School Community Memory</text>
<text x="58" y="209" class="muted" font-size="22">One request. A remembered approach. A visible next step.</text>

<rect x="55" y="261" width="326" height="291" rx="18" fill="url(#panel)" stroke="#405039"/>
