<text x="462" y="297" class="label lime">02</text><text x="497" y="297" class="white" font-size="18" font-weight="600">Agent + Memory</text>
<text x="844" y="297" class="label muted">03</text><text x="879" y="297" class="white" font-size="18" font-weight="600">Learning evidence</text>
<path d="M79 316H356M461 316H738M843 316H1120" stroke="#41553b"/>

