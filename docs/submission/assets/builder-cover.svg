<linearGradient id="memory" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#344c29"/><stop offset="1" stop-color="#1b2d1a"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b8f37a"/></marker>
<style>text{font-family:Arial,Helvetica,sans-serif}.white{fill:#ecf4e8}.muted{fill:#adbdac}.lime{fill:#b8f37a}.label{font-size:12px;letter-spacing:2px;font-weight:600}.body{font-size:16px}.line{fill:none;stroke:#57704c;stroke-width:2;stroke-linecap:round}</style>
</defs>
<rect width="1200" height="675" fill="url(#background)"/>
