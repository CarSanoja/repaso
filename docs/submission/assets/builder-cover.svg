<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Repaso - School Community Memory</title>
<desc id="desc">Conceptual cover showing three linked panels: conversation, agent and memory, and learning evidence. One request. A remembered approach. A visible next step. Built with Strands Agents and Amazon Bedrock AgentCore. This is an illustration, not a product screenshot or measured result.</desc>
