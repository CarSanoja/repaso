[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repaso"
version = "0.1.0"
description = "A reinforcement tutor families run from Telegram — an agent fleet on Strands + Amazon Bedrock AgentCore"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "strands-agents>=1.0",
    "boto3>=1.34",
    "httpx>=0.27",
    "pillow>=10.3",
    "mangum>=0.17",
    "pypdf==6.16.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "anyio>=4.4",
    "ruff>=0.5",
    "uvicorn>=0.30",
    "moto[events,sqs,dynamodb,s3,scheduler]==5.1.12",
    "build==1.3.0",
    "setuptools==80.9.0",
]
runtime = [
    "bedrock-agentcore>=0.1",
]
deploy = [
    "aws-cdk-lib>=2.150",
    "constructs>=10.3",
    "pyyaml>=6.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"repaso.simulator" = ["cassettes/*.jsonl"]
"repaso.tools" = ["fixtures/*.json"]
"repaso.api" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: calls real AWS services; enabled only with REPASO_LIVE_TESTS=1 and AWS config present",
    "benchmark: benchmark runners that produce report numbers",
    "calibration: golden-set calibration checks",
    "chaos: resilience scenarios",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
